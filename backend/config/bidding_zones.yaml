# Aufteilung von Ländern in Gebotszonen. Nur aktiv, wenn ENTSOE_API_TOKEN gesetzt ist:
# Erzeugung je Gebotszone aus ENTSO-E A75, Flüsse je Gebotszonen-Grenze aus ENTSO-E A11.
# Ein Land wird in einem Lauf nur aufgeteilt, wenn alle seine Gebotszonen aktuelle A75-Daten haben;
# sonst bleibt es ein Knoten mit Energy-Charts-Daten. Das Land selbst wird zusätzlich als
# verbrauchsgewichtetes Mittel seiner Gebotszonen ausgegeben.
#
# external: Grenzen zu anderen Zonen. Nachbar = Zonen-Code (zones.yaml), Gebotszone eines anderen
#           Landes (diese Datei) oder externe Region (z. B. GB). Grenzen zwischen zwei aufgeteilten
#           Ländern werden nur einmal benötigt, doppelte Einträge sind unschädlich.
# EIC-Codes: ENTSO-E Transparency Platform, Bidding Zones.
countries:
  "NO":
    zones:
      - {code: NO-NO1, name_de: "Norwegen Südost (NO1)", name_en: "Norway Southeast (NO1)", entsoe: 10YNO-1--------2}
      - {code: NO-NO2, name_de: "Norwegen Südwest (NO2)", name_en: "Norway Southwest (NO2)", entsoe: 10YNO-2--------T}
      - {code: NO-NO3, name_de: "Norwegen Mitte (NO3)", name_en: "Norway Central (NO3)", entsoe: 10YNO-3--------J}
      - {code: NO-NO4, name_de: "Norwegen Nord (NO4)", name_en: "Norway North (NO4)", entsoe: 10YNO-4--------9}
      - {code: NO-NO5, name_de: "Norwegen West (NO5)", name_en: "Norway West (NO5)", entsoe: 10Y1001A1001A48H}
    internal:
      - [NO-NO1, NO-NO2]
      - [NO-NO1, NO-NO3]
      - [NO-NO1, NO-NO5]
      - [NO-NO2, NO-NO5]
      - [NO-NO3, NO-NO4]
      - [NO-NO3, NO-NO5]
    external:
      - [NO-NO1, SE-SE3]
      - [NO-NO2, DE]
      - [NO-NO2, DK-DK1]
      - [NO-NO2, NL]
      - [NO-NO2, GB]
      - [NO-NO3, SE-SE2]
      - [NO-NO4, SE-SE1]
      - [NO-NO4, SE-SE2]
      - [NO-NO4, FI]
  SE:
