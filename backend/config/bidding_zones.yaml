      - {code: SE-SE3, name_de: "Schweden Mitte-Süd (SE3)", name_en: "Sweden South-Central (SE3)", entsoe: 10Y1001A1001A46L}
      - {code: SE-SE4, name_de: "Schweden Süd (SE4)", name_en: "Sweden South (SE4)", entsoe: 10Y1001A1001A47J}
