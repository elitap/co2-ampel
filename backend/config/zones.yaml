# Zonen des Modells.
#   code:           Zonen-Code in der Ausgabe
#   energy_charts:  Länder-Code der Energy-Charts API
#   alias:          Nachbar-ID, mit der Energy-Charts (cbpf) diese Zone bezeichnet
#   entsoe:         EIC-Code für ENTSO-E (Erzeugung A75/A69/A71 und Flüsse A11)
#
# Energy-Charts liefert Erzeugung und Grenzflüsse nur je Land. Länder mit mehreren Gebotszonen
# (NO, SE, DK, IT) werden daher als eine Zone geführt; Deutschland und Luxemburg (gemeinsame
# Gebotszone DE-LU) werden getrennt gerechnet, weil beide Quellen sie getrennt ausweisen.
# Großbritannien und die Ukraine sind extern (feste Intensität): Energy-Charts liefert für UK nur
# unvollständige Erzeugungsdaten (u. a. ohne Kernkraft) und für UA keine; ENTSO-E hat seit 2021 keine
# GB-Daten. Für Dänemark liefert Energy-Charts keine Erzeugung (HTTP 404): DK ist nur mit
# ENTSO-E-Token berechenbar, sonst "unknown" mit Ersatzintensität aus settings.yaml.
zones:
  - {code: AT, name_de: Österreich,              name_en: Austria,                energy_charts: at, alias: austria,            entsoe: 10YAT-APG------L}
  - {code: BA, name_de: Bosnien und Herzegowina, name_en: Bosnia and Herzegovina, energy_charts: ba, alias: bosnia_herzegovina, entsoe: 10YBA-JPCC-----D}
