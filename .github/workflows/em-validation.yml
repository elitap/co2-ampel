# Einmalige Validierung über Nacht: CO2-Ampel vs. Electricity Maps.
# - alle 15 min: Snapshot der eigenen veröffentlichten Werte (kein Electricity-Maps-Aufruf)
# - einmal pro Stunde (Lauf zwischen :00 und :14): Electricity Maps "latest" für 5 Zonen
# - erster Lauf nach WINDOW_END: Electricity Maps "history" (5 Aufrufe), Bericht, danach deaktiviert
#   sich der Workflow selbst. Electricity-Maps-Daten werden nicht auf Pages veröffentlicht.
name: em-validation

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | snapshot | snapshot-em | report"
        default: report

permissions: {}

concurrency:
  group: em-validation
  cancel-in-progress: false

env:
  WINDOW_START: "2026-11-21T22:00:00Z"
  WINDOW_END: "2026-11-22T07:00:00Z"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # Artefakte der Vorläufe lesen, Workflow am Ende deaktivieren
    steps:
      - name: Modus bestimmen
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          now=$(date -u +%s); end=$(date -u -d "$WINDOW_END" +%s); minute=$((10#$(date -u +%M)))
          mode="${INPUT_MODE:-auto}"
          if [ "$mode" = "auto" ]; then
            if [ "$now" -ge $((end + 7200)) ]; then mode=disable
            elif [ "$now" -ge "$end" ]; then mode=report
            elif [ "$minute" -lt 15 ]; then mode=snapshot-em
            else mode=snapshot; fi
          fi
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

      - name: Workflow deaktivieren (Fenster vorbei)
        if: steps.mode.outputs.mode == 'disable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable em-validation.yml --repo "$GITHUB_REPOSITORY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.mode != 'disable'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.mode.outputs.mode != 'disable'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Abhängigkeiten
        if: steps.mode.outputs.mode != 'disable'
        working-directory: backend
        run: python -m pip install --require-hashes --no-deps -r requirements.txt

      - name: Snapshot
        if: startsWith(steps.mode.outputs.mode, 'snapshot')
        working-directory: backend
        env:
          ELECTRICITYMAPS_TOKEN: ${{ steps.mode.outputs.mode == 'snapshot-em' && secrets.ELECTRICITYMAPS_TOKEN || '' }}
          WITH_EM: ${{ steps.mode.outputs.mode == 'snapshot-em' }}
        run: |
          args=(--out "$GITHUB_WORKSPACE/em-snap")
          if [ "$WITH_EM" = "true" ]; then args+=(--with-em); fi
          python -m co2ampel em-snapshot "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(steps.mode.outputs.mode, 'snapshot')
        with:
          name: em-snap-${{ github.run_id }}
          path: em-snap/
          retention-days: 2

      - name: Snapshots der Nacht laden
        if: steps.mode.outputs.mode == 'report'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p snaps
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"em-snap-\")) | select(.created_at >= \"$WINDOW_START\") | select(.expired | not) | .workflow_run.id" \
            | sort -u | while read -r rid; do
              gh run download "$rid" -n "em-snap-$rid" -D "snaps/$rid" --repo "$GITHUB_REPOSITORY" || true
            done
          find snaps -name snapshot.json | wc -l
      - name: Bericht
        if: steps.mode.outputs.mode == 'report'
        working-directory: backend
        env:
          ELECTRICITYMAPS_TOKEN: ${{ secrets.ELECTRICITYMAPS_TOKEN }}
        run: |
          python -m co2ampel em-report --snapshots "$GITHUB_WORKSPACE/snaps" --out "$GITHUB_WORKSPACE/em-report.md"
          cat "$GITHUB_WORKSPACE/em-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.mode.outputs.mode == 'report'
        with:
          name: em-report
          path: em-report.md
          retention-days: 7
      - name: Danach deaktivieren
        if: steps.mode.outputs.mode == 'report' && inputs.mode != 'report'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable em-validation.yml --repo "$GITHUB_REPOSITORY"

  # Ersatz-Taktgeber: GitHub hat die geplanten Läufe (cron) für dieses Repo anfangs nicht gestartet.
  # Solange in den letzten 40 min kein "schedule"-Lauf stattfand, plant dieser Job den nächsten Lauf
  # selbst ein (workflow_dispatch über GITHUB_TOKEN ist dafür erlaubt). Funktioniert cron, endet die Kette.
  next:
    needs: [run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Nächsten Lauf einplanen (nur falls cron ausbleibt)
        env:
          GH_TOKEN: ${{ github.token }}
          WF: em-validation.yml
        run: |
          set -euo pipefail
          if [ "$(date -u +%s)" -ge "$(date -u -d "$WINDOW_END" +%s)" ]; then echo "Fenster vorbei"; exit 0; fi
          since=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          sched=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF" --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$sched" ] && [[ "$sched" > "$since" ]]; then echo "cron aktiv ($sched) – keine Kette"; exit 0; fi
          started=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
          wait=$(( $(date -u -d "$started" +%s) + 900 - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then echo "warte $wait s"; sleep "$wait"; fi
          gh workflow run "$WF" --repo "$GITHUB_REPOSITORY"
