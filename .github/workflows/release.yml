# Baut bei einem Tag v* eine signierte Release-APK und veröffentlicht sie als GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # Release anlegen
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Tests und Lint
        # AGP 9 legt Unit-Tests standardmäßig nur für den Debug-Build-Typ an.
        run: ./gradlew --no-daemon lintRelease testDebugUnitTest

      - name: Signierte Release-APK bauen
        env:
          # Secrets nur in diesem Schritt
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Signatur prüfen
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/co2-ampel-${GITHUB_REF_NAME}.apk"
          sha256sum "$RUNNER_TEMP/co2-ampel-${GITHUB_REF_NAME}.apk"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/co2-ampel-${GITHUB_REF_NAME}.apk"
          (cd "$RUNNER_TEMP" && sha256sum "co2-ampel-${GITHUB_REF_NAME}.apk" > "co2-ampel-${GITHUB_REF_NAME}.apk.sha256")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "CO2-Ampel $GITHUB_REF_NAME" \
              --notes "Signierte Android-APK (minSdk 26). Installation: siehe README. SHA-256 in der .sha256-Datei."
          fi
